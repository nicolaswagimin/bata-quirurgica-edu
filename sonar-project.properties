# SonarQube Cloud: static analysis + coverage report. Informative only (the CI does not wait for
# the Quality Gate). Key and organization are the defaults SonarQube Cloud gives when importing
# github.com/nicolaswagimin/bata-quirurgica-edu; change them here if yours differ.
sonar.projectKey=nicolaswagimin_bata-quirurgica-edu
sonar.organization=nicolaswagimin
sonar.projectName=Bata Quirurgica Edu

sonar.sources=apps/web/src,services/api/src,services/api/scripts,packages/shared/src,infra/lib,infra/bin
sonar.tests=apps/web/test,apps/web/e2e,services/api/test,packages/shared/test,infra/test
sonar.sourceEncoding=UTF-8

# Generated or third-party assets, never hand-written code.
sonar.exclusions=**/node_modules/**,**/dist/**,**/cdk.out/**,**/coverage/**,apps/web/public/**

# Pixel-art sprite grids and lesson data are character tables, not logic.
sonar.cpd.exclusions=apps/web/src/art/**

# Vitest (v8) lcov files; the CI prefixes each SF: path with its package directory.
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,services/api/coverage/lcov.info,packages/shared/coverage/lcov.info,infra/coverage/lcov.info
