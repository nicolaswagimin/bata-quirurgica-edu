name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarQube Cloud needs full history for blame and new-code detection.
          fetch-depth: 0
          # The build never reads the Blender source in LFS (tools/bata-3d/*.blend): keep the
          # pointer file and skip the 100+ MB download and the LFS bandwidth quota.
          lfs: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          # corepack no crea el directorio: sin esto falla con ENOENT en ~/.local.
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          corepack enable --install-directory "$HOME/.local/bin"
          corepack prepare pnpm@11.28.2 --activate

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          COVERAGE: '1'

      # Informative: reports bugs, smells and coverage to SonarQube Cloud without blocking the gate.
      # Skipped until the SONAR_TOKEN repository secret exists (and on forks, which cannot read it).
      - name: Prefix lcov paths with their package
        if: env.SONAR_TOKEN != ''
        run: |
          for p in apps/web services/api packages/shared infra; do
            sed -i "s|^SF:|SF:$p/|" "$p/coverage/lcov.info"
          done

      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8.3.0

      - run: pnpm test:emu
      - run: pnpm synth
      - run: pnpm --filter @bata/web run mediapipe:prepare
      - run: pnpm --filter @bata/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:emu

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
